# Detects search / AI crawlers by User-Agent so the server_name block can
# serve them a prerendered HTML snapshot instead of the client-rendered SPA shell.
map $http_user_agent $is_crawler {
    default 0;
    ~*googlebot 1;
    ~*bingbot 1;
    ~*duckduckbot 1;
    ~*baiduspider 1;
    ~*yandexbot 1;
    ~*applebot 1;
    ~*facebookexternalhit 1;
    ~*twitterbot 1;
    ~*linkedinbot 1;
    ~*whatsapp 1;
    ~*telegrambot 1;
    ~*slackbot 1;
    ~*discordbot 1;
    ~*gptbot 1;
    ~*chatgpt-user 1;
    ~*oai-searchbot 1;
    ~*ccbot 1;
    ~*claudebot 1;
    ~*anthropic-ai 1;
    ~*perplexitybot 1;
}
